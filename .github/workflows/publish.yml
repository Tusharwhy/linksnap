name: Publish Linksnap images

on:
    push:
        branches:
            - main
permissions:
    contents: read
    packages: write
jobs:
    publish: 
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Login to GHCR
            uses: docker/login-action@v3
            with: 
                registry: ghcr.io
                username: ${{github.actor}}
                password: ${{secrets.GITHUB_TOKEN}}

          - name: Setup Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Build and push image
            uses: docker/build-push-action@v6
            with:
                context: ./api
                push: true
                tags: |
                   ghcr.io/tusharwhy/linksnap-api:${{ github.sha }}
                   ghcr.io/tusharwhy/linksnap-api:latest
            
          - name: Build and push Web image
            uses: docker/build-push-action@v6
            with:
                context: ./web
                push: true
                tags: |
                   ghcr.io/tusharwhy/linksnap-web:${{ github.sha }}
                   ghcr.io/tusharwhy/linksnap-web:latest
      
       
