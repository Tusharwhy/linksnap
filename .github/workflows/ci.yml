name: LinkSnap CI

on: 
    pull_request:
    push:
        branches:
            - main

permissions: 
    contents: read


jobs:
    api-ci:
        runs-on: ubuntu-latest
        steps:
         - name: Checkout Repository
           uses: actions/checkout@v4

         - name: Set up Node js and cache dependencies
           uses: actions/setup-node@v4
           with: 
            node-version: 22
            cache: npm
            cache-dependency-path: api/package-lock.json

         - name: Install API Dependencies
           working-directory: api
           run: npm ci

         - name: Setup cache for Web dependecies
           uses: actions/setup-node@v4
           with:
            node-version: 22
            cache: npm
            cache-dependency-path: web/package-lock.json 
        
         - name: Build api
           working-directory: api
           run: npm run build

        
    web-ci:
        runs-on: ubuntu-latest
        steps:
         - name: Checkout Repository
           uses: actions/checkout@v4

         - name: Setup cache for Web dependecies
           uses: actions/setup-node@v4
           with:
            node-version: 22
            cache: npm
            cache-dependency-path: web/package-lock.json 

         - name: Install Web Dependencies
           working-directory: web
           run: npm ci
         
         - name: Lint web
           working-directory: web
           run: npm run lint
         
         - name: Build web
           working-directory: web
           run: npm run build